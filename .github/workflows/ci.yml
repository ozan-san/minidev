name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci
      - run: CI=1 npm run -s test

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci
      - name: Install pi peer packages (not saved to lockfile)
        run: npm install --no-save @earendil-works/pi-coding-agent@1 @earendil-works/pi-tui@1
      - name: Typecheck
        run: npm run -s typecheck
        env:
          PI_NODE_MODULES: ${{ github.workspace }}/node_modules
